      </div>

      <div class="silhouette-step-card sil-final-card">
        <div class="sil-step-title">STEP 5 — Calculate silhouette s(i)</div>
        <div class="sil-equation">
          s(${d.point.name}) =
          (${d.nearest.toFixed(3)} − ${d.a.toFixed(3)})
          /
          max(${d.a.toFixed(3)}, ${d.nearest.toFixed(3)})
          <br>
          =
          ${(d.nearest - d.a).toFixed(3)}
          /
          ${Math.max(d.a, d.nearest).toFixed(3)}
          <br>
          =
          <strong>${d.silhouette.toFixed(3)}</strong>
        </div>
        <div class="sil-interpretation">
          <strong>Interpretation</strong><br>
          a(i) = ${d.a.toFixed(3)} → average distance to own cluster<br>
          b(i) = ${d.nearest.toFixed(3)} → average distance to nearest other cluster<br>
          Difference = ${(d.nearest - d.a).toFixed(3)}<br><br>
          ${d.nearest > d.a
            ? `${d.point.name} is closer to its own cluster than to its nearest alternative cluster.`
            : `${d.point.name} is not closer to its own cluster than to its nearest alternative cluster.`}
        </div>
      </div>
    `;

    if (silhouetteShowAll) {
      html += `
        <div class="silhouette-step-card">
          <div class="sil-step-title">STEP 6 — Silhouette score for every point</div>
          <div class="calc-table-wrap silhouette-all-table">
            <table class="calc">
              <thead>
                <tr>
                  <th>Point</th>
                  <th>Cluster</th>
                  <th>a(i)</th>
                  <th>b(i)</th>
                  <th>s(i)</th>
                </tr>
              </thead>
              <tbody>
                ${allDetails.map((x, i) => `
                  <tr${i === silhouetteSelectedPoint ? ' class="selected-sil-row"' : ""}>
                    <td>${x.point.name}</td>
                    <td>C${x.displayCluster}</td>
                    <td>${x.a.toFixed(3)}</td>
                    <td>${x.nearest.toFixed(3)}</td>
                    <td><strong>${x.silhouette.toFixed(3)}</strong></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          <div class="sil-average-box">
            S(K = ${k}) =
            (${allDetails.map(x => x.silhouette.toFixed(3)).join(" + ")})
            / ${allDetails.length}
            <br>
            = <strong>${allDetails.reduce((s,x) => s+x.silhouette,0).toFixed(3)}
              / ${allDetails.length}
              = ${(allDetails.reduce((s,x) => s+x.silhouette,0) / Math.max(1,allDetails.length)).toFixed(3)}
            </strong>
          </div>
        </div>
      `;
    }

    return html;
  }

  function setSilhouetteSelectedPoint(index) {
    if (!Number.isInteger(index) || index < 0 || index >= POINTS.length) return;
    silhouetteSelectedPoint = index;
    renderFrame(currentIdx, { animate: false });
  }

  function toggleSilhouetteCompleteCalculation() {
    silhouetteShowAll = !silhouetteShowAll;
    renderFrame(currentIdx, { animate: false });
  }


  // ---------------------------------------------------------------
  // K-MEANS++ EDUCATIONAL CALCULATION
  // ---------------------------------------------------------------

  function ppSelectedCentroids(frame) {
    if (!frame || frame.type !== "pp-select") return [];

    return (frame.chosenIndices || []).map((index, k) => ({
      k: k + 1,
      index,
      point: POINTS[index],
      centroid: [
        POINTS[index].x,
        POINTS[index].y
      ]
    }));
  }

  function ppDistanceSquared(point, centroid) {
    const dx = point.x - centroid[0];
    const dy = point.y - centroid[1];

    return {
      dx,
      dy,
      dx2: dx * dx,
      dy2: dy * dy,
      d2: dx * dx + dy * dy
    };
  }

  function renderKMeansPPEducationalCalculation(frame, selectedIndex) {
    if (!frame || frame.type !== "pp-select") return "";

    const safeIndex =
      Number.isInteger(selectedIndex) &&
      selectedIndex >= 0 &&
      selectedIndex < POINTS.length
        ? selectedIndex
        : frame.chosenIndex;

    const point = POINTS[safeIndex];
    const selected = ppSelectedCentroids(frame);
    const isFirstStep = frame.ppStep === 1;

    let html = `
      <div class="pp-edu-header">
        <div class="pp-edu-title">EDUCATIONAL CALCULATION</div>
        <div class="pp-edu-subtitle">
          Click any point in the table to see exactly how its
          K-Means++ value is calculated.
        </div>
      </div>

      <div class="pp-formula-card">
        <div class="pp-card-label">K-MEANS++ PROBABILITY FORMULA</div>
        <div class="pp-formula">
          P(xᵢ) =
          <span class="frac">
            <span>D(xᵢ)²</span>
            <span>Σ D(xⱼ)²</span>
          </span>
        </div>
        <div class="pp-small-note">
          D(xᵢ) is the distance from xᵢ to its nearest
          already-selected centroid.
        </div>
      </div>

      <div class="pp-selected-card">
        <div class="pp-card-label">SELECTED POINT</div>
        <div class="pp-selected-point">
          <strong>${point.name}</strong>
          = (${point.x.toFixed(2)}, ${point.y.toFixed(2)})
        </div>
      </div>
    `;

    // FIRST CENTROID SPECIAL CASE
    if (isFirstStep) {
      const n = POINTS.length;
      const uniform = n ? 1 / n : 0;

      html += `
        <div class="pp-step-card">
          <div class="pp-step-title">STEP 1 — Choose the first centroid</div>
          <div class="pp-explain">
            The first centroid is selected uniformly at random from the
            dataset. No distance calculation is performed yet.
          </div>

          <div class="pp-calculation">
            P(xᵢ) = 1 / n
            <br>
            = 1 / ${n}
            <br>
            = <strong>${(uniform * 100).toFixed(2)}%</strong>
          </div>

          <div class="pp-result">
            ${point.name === POINTS[frame.chosenIndex].name
              ? `Selected first centroid: <strong>C1 = ${point.name}</strong>`
              : `${point.name} was not selected as C1 in this run.`
            }
          </div>

          <div class="pp-why">
            <strong>Important:</strong> D(x)² and weighted K-Means++
            probabilities do not exist for the first centroid selection.
          </div>
        </div>
      `;

      return html;
    }

    // EXISTING CENTROIDS
    html += `
      <div class="pp-step-card">
        <div class="pp-step-title">STEP 1 — Already selected centroids</div>
        <div class="pp-explain">
          For this selection round, these are the centroids that already
          exist. They come directly from the current K-Means++ state.
        </div>

        <div class="pp-centroid-list">
          ${selected.map(c => `
            <div class="pp-centroid-row" data-centroid-index="${c.index}">
              <span class="pp-centroid-name">C${c.k}</span>
              <span>${c.point.name} = (${c.point.x.toFixed(2)}, ${c.point.y.toFixed(2)})</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;

    // DISTANCE TO EVERY SELECTED CENTROID
    const distanceRows = selected.map(c => {
      const d = ppDistanceSquared(point, c.centroid);

      return {
        ...c,
        ...d
      };
    });

    const nearest = distanceRows.length
      ? distanceRows.reduce((best, current) =>
          current.d2 < best.d2 ? current : best
        )
      : null;

    html += `
      <div class="pp-step-card">
        <div class="pp-step-title">STEP 2 — Calculate D(x)² to every selected centroid</div>
        <div class="pp-explain">
          K-Means++ calculates the squared distance from the selected point
          to <strong>every</strong> already-selected centroid.
        </div>
    `;

    distanceRows.forEach(d => {
      const nearestClass = nearest && d.k === nearest.k ? " pp-nearest" : "";

      html += `
        <div class="pp-distance-card${nearestClass}">
          <div class="pp-distance-title">
            Distance² from ${point.name} to C${d.k}
            ${nearest && d.k === nearest.k ? '<span class="pp-nearest-badge">NEAREST</span>' : ""}
          </div>

          <div class="pp-coordinates">
            ${point.name} = (${point.x.toFixed(2)}, ${point.y.toFixed(2)})<br>
            C${d.k} = (${d.centroid[0].toFixed(2)}, ${d.centroid[1].toFixed(2)})
          </div>

          <div class="pp-calculation">
            D(${point.name}, C${d.k})²
            <br>
            = (${point.x.toFixed(2)} − ${d.centroid[0].toFixed(2)})²
              + (${point.y.toFixed(2)} − ${d.centroid[1].toFixed(2)})²
            <br>
            = (${d.dx.toFixed(2)})² + (${d.dy.toFixed(2)})²
            <br>
            = ${d.dx2.toFixed(2)} + ${d.dy2.toFixed(2)}
            <br>
            = <strong>${d.d2.toFixed(2)}</strong>
          </div>
        </div>
      `;
    });

    if (nearest) {
      html += `
        <div class="pp-min-card">
          <div class="pp-step-title">STEP 3 — Take the minimum distance²</div>

          <div class="pp-calculation">
            D(${point.name})² =
            min(${distanceRows.map(d => d.d2.toFixed(2)).join(", ")})
            <br>
            = <strong>${nearest.d2.toFixed(2)}</strong>
          </div>

          <div class="pp-result">
            ${nearest.d2.toFixed(2)} is used because
            <strong>C${nearest.k}</strong> is the nearest already-selected
            centroid to ${point.name}.
          </div>

          <div class="pp-why">
            <strong>Important:</strong> K-Means++ uses the nearest
            already-selected centroid — not simply the most recently selected centroid.
          </div>
        </div>
      `;
    }

    // TOTAL D² AND PROBABILITY
    const d2 = frame.distSq ? frame.distSq[safeIndex] : (nearest ? nearest.d2 : 0);
    const total = typeof frame.totalDistSq === "number"
      ? frame.totalDistSq
      : (frame.probs
        ? POINTS.reduce((sum, _, i) => sum + ((frame.probs[i] || 0) > 0
            ? frame.distSq[i]
            : 0), 0)
        : 0);

    const probability = frame.probs ? (frame.probs[safeIndex] || 0) : 0;

    html += `
      <div class="pp-step-card">
        <div class="pp-step-title">STEP 4 — Calculate ΣD(x)²</div>

        <div class="pp-explain">
          The denominator is the sum of D(x)² for all points that are
          eligible to be selected.
        </div>

        <div class="pp-denominator">
          ${POINTS.map((p, i) => `
            <span>${p.name}: ${(frame.distSq ? frame.distSq[i] : 0).toFixed(2)}</span>
          `).join(" + ")}
          <br>
          = <strong>${total.toFixed(2)}</strong>
        </div>
      </div>

      <div class="pp-step-card pp-probability-card">
        <div class="pp-step-title">STEP 5 — Calculate probability</div>

        <div class="pp-calculation">
          P(${point.name}) =
          D(${point.name})² / ΣD(x)²
          <br>
          = ${d2.toFixed(2)} / ${total.toFixed(2)}
          <br>
          = ${probability.toFixed(4)}
          <br>
          = <strong>${(probability * 100).toFixed(2)}%</strong>
        </div>

        <div class="pp-probability-bar">
          <div class="pp-probability-fill" style="width:${Math.min(100, probability * 100)}%"></div>
        </div>

        <div class="pp-why">
          <strong>Why?</strong>
          Points farther from existing centroids have larger D(x)²,
          so they receive a larger probability of becoming the next centroid.
        </div>
      </div>
    `;

    // RANDOM SAMPLING RESULT — ONLY IF THE ACTUAL IMPLEMENTATION STORED r.
    if (typeof frame.randomValue === "number" && Array.isArray(frame.cumulativeIntervals)) {
      const interval = frame.cumulativeIntervals.find(x => x.index === safeIndex);

      html += `
        <div class="pp-step-card">
          <div class="pp-step-title">STEP 6 — Weighted random sampling</div>

          <div class="pp-explain">
            The next centroid is sampled from the probability distribution.
            It is <strong>not</strong> necessarily the point with the highest probability.
          </div>

          <div class="pp-random-value">
            Random sample r = <strong>${frame.randomValue.toFixed(4)}</strong>
          </div>

          ${interval ? `
            <div class="pp-calculation">
              ${point.name}'s cumulative interval:
              <br>
              ${interval.start.toFixed(4)}
              &lt; r ≤
              ${interval.end.toFixed(4)}
              <br><br>
              ${interval.start.toFixed(4)}
              &lt;
              <strong>${frame.randomValue.toFixed(4)}</strong>
              ≤
              ${interval.end.toFixed(4)}
            </div>
            <div class="pp-result">
              ${point.name === POINTS[frame.chosenIndex].name
                ? `<strong>${point.name} was sampled as the next centroid.</strong>`
                : `${point.name} was not sampled in this run.`
              }
            </div>
          ` : `
            <div class="pp-note">
              ${point.name} is not in the available sampling interval because
              it was already selected as a centroid.
            </div>
          `}

          <div class="pp-intervals">
            ${frame.cumulativeIntervals.map((x, n) => `
              <div class="${x.index === safeIndex ? "pp-interval-selected" : ""}">
                ${POINTS[x.index].name}:
                ${x.start.toFixed(4)} → ${x.end.toFixed(4)}
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    // COMPLETE CALCULATION SUMMARY
    html += `
      <div class="pp-step-card pp-complete-card">
        <div class="pp-step-title">COMPLETE CALCULATION — ${point.name}</div>

        <div class="pp-summary-line">
          <span>Nearest centroid</span>
          <strong>${nearest ? `C${nearest.k}` : "—"}</strong>
        </div>

        <div class="pp-summary-line">
          <span>D(${point.name})²</span>
          <strong>${d2.toFixed(2)}</strong>
        </div>

        <div class="pp-summary-line">
          <span>ΣD(x)²</span>
          <strong>${total.toFixed(2)}</strong>
        </div>

        <div class="pp-summary-line pp-summary-final">
          <span>P(${point.name})</span>
          <strong>${(probability * 100).toFixed(2)}%</strong>
        </div>
      </div>
    `;

    return html;
  }

  function bindKMeansPPTableRows(frame) {
    if (!frame || frame.type !== "pp-select" || frame.ppStep === 1) return;

    mathPanel.querySelectorAll("[data-pp-point-index]").forEach(row => {
      row.addEventListener("click", () => {
        const index = Number(row.getAttribute("data-pp-point-index"));
        if (!Number.isInteger(index)) return;

        ppSelectedPoint = index;
        renderFrame(currentIdx, { animate: false });
      });
    });
  }

  function renderKMeansPPDistanceOverlay(frame, selectedIndex) {
    linkLayer.innerHTML = "";

    if (!frame || frame.type !== "pp-select") return;

    const safeIndex =
      Number.isInteger(selectedIndex) &&
      selectedIndex >= 0 &&
      selectedIndex < POINTS.length
        ? selectedIndex
        : frame.chosenIndex;

    const selectedPoint = POINTS[safeIndex];

    // Highlight selected point.
    POINTS.forEach((_, i) => {
      if (!pointEls[i]) return;

      if (i === safeIndex) {
        pointEls[i].setAttribute("fill", "#DC2626");
        pointEls[i].setAttribute("stroke", "#7F1D1D");
        pointEls[i].setAttribute("r", 13);
      } else if (frame.chosenIndices && frame.chosenIndices.includes(i)) {
        pointEls[i].setAttribute("fill", "#111827");
        pointEls[i].setAttribute("stroke", "#111827");
        pointEls[i].setAttribute("r", 10);
      } else {
        pointEls[i].setAttribute("fill", "#6B7280");
        pointEls[i].setAttribute("stroke", "#374151");
        pointEls[i].setAttribute("r", 10);
      }
    });

    if (frame.ppStep === 1) return;

    const selected = ppSelectedCentroids(frame);

    centroidEls.forEach(ce => {
      ce.star.setAttribute("stroke", "#111827");
      ce.star.setAttribute("stroke-width", "2.5");
    });

    selected.forEach(c => {
      const d = ppDistanceSquared(selectedPoint, c.centroid);
      const isNearest = selected.every(other =>
        d.d2 <= ppDistanceSquared(selectedPoint, other.centroid).d2 + 1e-12
      );

      // Visually emphasize the actual nearest selected centroid.
      const centroidVisual = centroidEls[c.k - 1];
      if (centroidVisual) {
        centroidVisual.star.setAttribute("stroke", isNearest ? "#DC2626" : "#111827");
        centroidVisual.star.setAttribute("stroke-width", isNearest ? "4" : "2.5");
      }

      const line = el("line", {
        x1: sx(selectedPoint.x),
        y1: sy(selectedPoint.y),
        x2: sx(c.centroid[0]),
        y2: sy(c.centroid[1]),
        stroke: isNearest ? "#DC2626" : "#64748B",
        "stroke-width": isNearest ? 4 : 2,
        "stroke-dasharray": isNearest ? "none" : "6,5",
        opacity: 0.9
      });

      linkLayer.appendChild(line);

      const mx = (sx(selectedPoint.x) + sx(c.centroid[0])) / 2;
      const my = (sy(selectedPoint.y) + sy(c.centroid[1])) / 2;

      const label = el("text", {
        x: mx,
        y: my - 8,
        "text-anchor": "middle",
        "font-size": 12,
        "font-family": "IBM Plex Mono, monospace",
        "font-weight": "700",
        fill: isNearest ? "#DC2626" : "#475569",
        "pointer-events": "none"
      });
      label.textContent = `D²=${d.d2.toFixed(2)}`;
      linkLayer.appendChild(label);
    });

    // Keep selected centroid stars above the lines.
    centroidEls.forEach((ce, k) => {
      const visible = frame.chosenIndices &&
        frame.chosenIndices.includes(k < POINTS.length ? k : -1);
      ce.g.style.opacity = k < frame.visibleCount ? 1 : 0;
    });
  }

  function renderMathPanel(frame) {
    let html = "";

    // Elbow Method frames
    if (frame.type === "elbow-intro") {
      html += `<span class="badge" style="background:#FEF3C7;color:#D97706;">elbow method</span>`;
      html += `<h2 class="step-title">Elbow Method — Introduction</h2>`;
      html += `<p class="step-desc">The <strong>Elbow Method</strong> helps determine the optimal number of clusters by plotting WCSS (Within-Cluster Sum of Squares) for different values of K.</p>`;
      html += `<div class="formula-box"><div class="label">Goal</div><div class="formula">Find the "elbow" point where adding more clusters gives diminishing returns in WCSS reduction.</div></div>`;
      html += `<div class="note">We'll test K = 1 to ${frame.totalSteps}. Each step calculates one K value and immediately adds its WCSS point to the graph. Press <kbd>Next</kbd> or <kbd>Play</kbd> to begin.</div>`;
    } else if (frame.type === "elbow-computing") {
      html += `<span class="badge" style="background:#FEF3C7;color:#D97706;">elbow method</span>`;
      html += `<h2 class="step-title">Testing K = ${frame.currentK}</h2>`;
      html += `<p class="step-desc">Running K-Means with <strong>K = ${frame.currentK}</strong> clusters (5 times to ensure stability)...</p>`;
      html += `<div class="formula-box"><div class="label">WCSS Formula</div><div class="formula">WCSS = Σ(distance from each point to its centroid)²</div></div>`;
      if (frame.results.length > 0) {
        html += `<div class="stat-grid">`;
        html += `<div class="stat"><div class="k">Tests Completed</div><div class="v">${frame.results.length} / ${frame.totalSteps}</div></div>`;
        html += `</div>`;
      }
    } else if (frame.type === "elbow-result") {
      html += `<span class="badge" style="background:#FEF3C7;color:#D97706;">elbow method</span>`;
      html += `<h2 class="step-title">K = ${frame.currentK} — Result</h2>`;
      html += `<p class="step-desc">With <strong>K = ${frame.currentK}</strong> clusters, the best WCSS (from 5 runs) is:</p>`;
      html += `<div class="stat-grid">`;
      html += `<div class="stat"><div class="k">K Value</div><div class="v">${frame.currentK}</div></div>`;
      html += `<div class="stat"><div class="k">WCSS</div><div class="v">${fmt(frame.wcss)}</div></div>`;
      html += `</div>`;
      html += `<div class="formula-box"><div class="label">Progress</div><div class="formula">${frame.step} of ${frame.totalSteps} tests completed</div></div>`;
      html += `<div class="note">The graph shows all tested K values so far. Notice how WCSS generally decreases as K increases.</div>`;
      html += renderElbowMath(frame);
    } else if (frame.type === "elbow-done") {
      html += `<span class="badge done">analysis complete</span>`;
      html += `<h2 class="step-title">Elbow Method — Recommendation</h2>`;
      html += `<p class="step-desc">All K values tested. The <strong>elbow point</strong> is detected as the largest normalized bend in the WCSS curve.</p>`;
      html += `<div class="stat-grid">`;
      html += `<div class="stat"><div class="k">Recommended K</div><div class="v">${frame.elbowK}</div></div>`;
      html += `<div class="stat"><div class="k">Tests Run</div><div class="v">${frame.results.length}</div></div>`;
      html += `</div>`;
      html += `<div class="formula-box"><div class="label">Why K = ${frame.elbowK}?</div><div class="formula">This point sits farthest from the straight line between the first and last WCSS values, where the curve bends most visibly.</div></div>`;
      html += `<div class="note">The complete WCSS curve is now available on the graph. The selected elbow is K = ${frame.elbowK}.</div>`;
      const elbowFinal = frame.results.find(r => r.k === frame.elbowK) || frame.results[frame.results.length - 1];
      if (elbowFinal) {
        html += renderElbowMath({
          currentK: elbowFinal.k,
          assignments: elbowFinal.assignments,
          centroids: elbowFinal.centroids,
          wcss: elbowFinal.wcss,
          results: frame.results
        });
      }
    }

    // Silhouette Analysis frames
    else if (frame.type === "silhouette-intro") {
      html += `<span class="badge" style="background:#F3E8FF;color:#7C3AED;">silhouette analysis</span>`;
      html += `<h2 class="step-title">Silhouette Analysis — Introduction</h2>`;
      html += `<p class="step-desc">The <strong>Silhouette Score</strong> measures how well-separated and cohesive the clusters are. Scores range from -1 to +1.</p>`;
      html += `<div class="formula-box"><div class="label">Silhouette Method — core mathematics</div><div class="formula">a(i) = average distance to ALL OTHER points in the SAME cluster<br><br>b(i) = MINIMUM average distance to every OTHER cluster<br><br>s(i) = (b(i) − a(i)) / max(a(i), b(i))</div><div class="small-note">a(i) = intra-cluster distance · b(i) = nearest-cluster distance · s(i) = silhouette coefficient</div></div>`;
      html += `<div class="note"><strong>Think of it this way:</strong><br>a(i) → “How close am I to my own cluster?”<br>b(i) → “How far am I from the nearest other cluster?”<br>s(i) → “How well does this point fit its cluster?”<br><br>We'll test K = 2 to ${frame.totalSteps + 1}. Press <kbd>Next</kbd> or <kbd>Play</kbd> to begin.</div>`;
    } else if (frame.type === "silhouette-computing") {
      html += `<span class="badge" style="background:#F3E8FF;color:#7C3AED;">silhouette analysis</span>`;
      html += `<h2 class="step-title">Testing K = ${frame.currentK}</h2>`;
      html += `<p class="step-desc">Running K-Means with <strong>K = ${frame.currentK}</strong> clusters, then calculating silhouette scores for each point...</p>`;
      html += `<div class="formula-box"><div class="label">Process</div><div class="formula">1. Run K-Means (5 times)<br>2. Calculate silhouette for each point<br>3. Average all scores</div></div>`;
      if (frame.results.length > 0) {
        html += `<div class="stat-grid">`;
        html += `<div class="stat"><div class="k">Tests Completed</div><div class="v">${frame.results.length} / ${frame.totalSteps}</div></div>`;
        html += `</div>`;
      }
    } else if (frame.type === "silhouette-result") {
      html += `<span class="badge" style="background:#F3E8FF;color:#7C3AED;">silhouette analysis</span>`;
      html += `<h2 class="step-title">K = ${frame.currentK} — Result</h2>`;
      html += `<p class="step-desc">With <strong>K = ${frame.currentK}</strong> clusters, the silhouette analysis shows:</p>`;
      html += `<div class="stat-grid">`;
      html += `<div class="stat"><div class="k">K Value</div><div class="v">${frame.currentK}</div></div>`;
      html += `<div class="stat"><div class="k">Silhouette Score</div><div class="v">${fmt(frame.silhouette)}</div></div>`;
      html += `</div>`;
      html += `<div class="formula-box"><div class="label">Current K calculation</div><div class="formula">The score below is calculated from the silhouette coefficient of EVERY point, not from centroid distances.</div></div>`;
      html += `<div class="note">Progress: ${frame.step} of ${frame.totalSteps} tests completed. The graph shows all tested K values.</div>`;
      html += renderSilhouetteMath(frame);
    } else if (frame.type === "silhouette-done") {
      html += `<span class="badge done">analysis complete</span>`;
      html += `<h2 class="step-title">Silhouette Analysis — Recommendation</h2>`;
      html += `<p class="step-desc">All K values tested. The highest silhouette score indicates the best cluster separation.</p>`;
      html += `<div class="stat-grid">`;
      html += `<div class="stat"><div class="k">Recommended K</div><div class="v">${frame.bestK}</div></div>`;
      html += `<div class="stat"><div class="k">Best Score</div><div class="v">${fmt(frame.bestScore)}</div></div>`;
      html += `</div>`;
      html += `<div class="formula-box"><div class="label">Why K = ${frame.bestK}?</div><div class="formula">This K value has the highest average silhouette score, meaning the clusters are most well-separated and cohesive.</div></div>`;
      html += `<div class="note">The complete silhouette curve is now available on the graph. The highest average score occurs at K = ${frame.bestK}.</div>`;
      const silhouetteFinal = frame.results.find(r => r.k === frame.bestK) || frame.results[frame.results.length - 1];
      if (silhouetteFinal) {
        html += renderSilhouetteMath({
          currentK: silhouetteFinal.k,
          assignments: silhouetteFinal.assignments,
          centroids: silhouetteFinal.centroids,
          silhouette: silhouetteFinal.silhouette,
          results: frame.results
        });
      }
    }

    // Original K-Means frames
    else if (frame.type === "init") {
      html += `<span class="badge">setup</span>`;
      html += `<h2 class="step-title">Initial centroids</h2>`;
      html += `<p class="step-desc">K = ${K} was chosen ahead of time. These starting positions match the notes' worked example. Press <kbd>Next</kbd> or <kbd>Play</kbd> to begin the assign → update loop.</p>`;
      html += `<div class="formula-box"><div class="label">Starting centroids</div><div class="formula">` +
        frame.centroids.slice(0, K).map((c, k) => `C${k + 1} = (${fmt(c[0])}, ${fmt(c[1])})`).join("<br>") + `</div></div>`;
      html += `<div class="note">Every point shows in neutral grey — nothing has been assigned to a cluster yet.</div>`;
    } else if (frame.type === "pp-select") {
      html += `<span class="badge" style="background:#FEF3C7;color:#D97706;">k-means++ init</span>`;
      html += `<h2 class="step-title">Choosing centroid ${frame.ppStep} of ${frame.totalSteps}</h2>`;
      if (frame.ppStep === 1) {
        html += `<p class="step-desc">The first centroid is picked <strong>uniformly at random</strong> from the data points — no distances are involved yet.</p>`;
        html += `<div class="formula-box"><div class="label">Picked</div><div class="formula">C1 = ${POINTS[frame.chosenIndex].name} = (${fmt(POINTS[frame.chosenIndex].x)}, ${fmt(POINTS[frame.chosenIndex].y)})</div></div>`;
        html += renderKMeansPPEducationalCalculation(frame, ppSelectedPoint);
      } else {
        html += `<p class="step-desc">Every point gets a probability proportional to its squared distance from the <strong>nearest already-chosen</strong> centroid — points far from existing centroids are more likely to be picked next.</p>`;
        html += `<div class="formula-box"><div class="label">Sampling probability</div><div class="formula">P(x) ∝ D(x)²<br>D(x) = distance to nearest chosen centroid</div></div>`;
        html += `<div class="calc-table-wrap"><table class="calc"><thead><tr><th>Pt</th><th>D(x)²</th><th>P(x)</th></tr></thead><tbody>`;
        POINTS.forEach((p, i) => {
          const already = frame.chosenIndices.includes(i);
          const isPick = i === frame.chosenIndex;
          const isSelected = i === ppSelectedPoint;

          html += `<tr
            data-pp-point-index="${i}"
            class="${isSelected ? "pp-selected-row" : ""}"
            style="cursor:pointer"
            title="Click to show calculation"
          >
            <td>${p.name}${already ? " •" : ""}</td>
            <td>${fmt(frame.distSq[i])}</td>
            <td${isPick ? ' class="win" style="color:#DC2626"' : ""}>${(frame.probs[i] * 100).toFixed(2)}%</td>
          </tr>`;
        });
        html += `</tbody></table></div>`;

        html += `
          <div class="pp-table-hint">
            Click any point row to open its complete K-Means++ calculation.
          </div>
        `;

        html += renderKMeansPPEducationalCalculation(
          frame,
          ppSelectedPoint
        );

        html += `<div class="note">
          Picked: <strong style="color:#DC2626">${POINTS[frame.chosenIndex].name}</strong>.
          Points already used as centroids (•) have D(x)² = 0 and probability 0,
          so they cannot be selected again.
        </div>`;
      }
    } else if (frame.type === "ppready") {
      html += `<span class="badge" style="background:#FEF3C7;color:#D97706;">k-means++ init</span>`;
      html += `<h2 class="step-title">Initialization complete</h2>`;
      html += `<p class="step-desc">K-Means++ only changes <strong>how the starting centroids are picked</strong> — from here it's the exact same assign → update loop as standard K-Means.</p>`;
      html += `<div class="formula-box"><div class="label">Chosen centroids</div><div class="formula">` +
        frame.centroids.slice(0, K).map((c, k) => `C${k + 1} = (${fmt(c[0])}, ${fmt(c[1])})`).join("<br>") + `</div></div>`;
      html += `<div class="note">Press <kbd>Next</kbd> or <kbd>Play</kbd> to continue. Hit <kbd>Reset</kbd> any time to re-roll a fresh K-Means++ run.</div>`;
    } else if (frame.type === "assign") {
      html += `<span class="badge assign">assignment step</span>`;
      html += `<h2 class="step-title">Iteration ${frame.iteration} — assign points</h2>`;
      html += `<p class="step-desc">Every point is compared against all K centroids and joins the <strong>nearest</strong> one.</p>`;
      html += `<div class="formula-box"><div class="label">Euclidean distance</div><div class="formula">d(x, μ) = √[(x₁−μ₁)² + (x₂−μ₂)²]</div></div>`;
      html += `<div class="calc-table-wrap"><table class="calc"><thead><tr><th>Pt</th>` +
        frame.centroids.slice(0, K).map((_, k) => `<th>→C${k + 1}</th>`).join("") + `<th>Wins</th></tr></thead><tbody>`;
      POINTS.forEach((p, i) => {
        const d = frame.distances[i];
        const winner = frame.assignments[i];
        html += `<tr><td>${p.name}</td>` +
          d.slice(0, K).map((v, k) => `<td${k === winner ? ` class="win" style="color:${CLUSTER_COLORS_SOLID_LIGHT[k]}"` : ""}>${fmt(v)}</td>`).join("") +
          `<td style="color:${CLUSTER_COLORS_SOLID_LIGHT[winner]};font-weight:700;">C${winner + 1}</td></tr>`;
      });
      html += `</tbody></table></div>`;
      html += renderWCSSCalculation(frame.centroids, frame.assignments, "WCSS calculation — after assignment");
      html += `<div class="note">WCSS after this assignment: <strong>${fmt(frame.wcss)}</strong> — add the squared distance of every point to the centroid it just joined.</div>`;
    } else if (frame.type === "update") {
      html += `<span class="badge update">update step</span>`;
      html += `<h2 class="step-title">Iteration ${frame.iteration} — move centroids</h2>`;
      html += `<p class="step-desc">Each centroid jumps to the <strong>mean</strong> position of the points currently assigned to it.</p>`;
      html += `<div class="formula-box"><div class="label">Centroid update</div><div class="formula">μₖ = (1/nₖ) Σ xᵢ</div></div>`;
      frame.clusterMembers.slice(0, K).forEach((members, k) => {
        const names = members.map(m => m.p.name).join(" + ");
        const sx_ = members.reduce((s, m) => s + m.p.x, 0);
        const sy_ = members.reduce((s, m) => s + m.p.y, 0);
        const n = members.length || 1;
        html += `<div class="mean-block">
          <div class="clabel"><span class="dot" style="background:${CLUSTER_COLORS_SOLID_LIGHT[k]}"></span>Cluster ${k + 1} (n=${members.length})</div>
          <div class="expr">μ${k + 1} = ((${names || "—"})/${n})<br>
          &nbsp;&nbsp;= (${fmt(sx_)}/${n}, ${fmt(sy_)}/${n})<br>
          &nbsp;&nbsp;= <strong>(${fmt(frame.centroids[k][0])}, ${fmt(frame.centroids[k][1])})</strong></div>
        </div>`;
      });
      html += renderWCSSCalculation(frame.centroids, frame.assignments, "WCSS calculation — using new centroids");
      html += `<div class="note">WCSS after moving: <strong>${fmt(frame.wcss)}</strong> — now recalculate every point's squared distance using the new centroid positions.</div>`;
    } else if (frame.type === "done") {
      html += `<span class="badge done">converged</span>`;
      html += `<h2 class="step-title">Stopped — no more movement</h2>`;
      html += `<p class="step-desc">Assignments and centroids are unchanged from the previous iteration, so the algorithm stops here.</p>`;
      html += `<div class="formula-box"><div class="label">Final centroids</div><div class="formula">` +
        frame.centroids.slice(0, K).map((c, k) => `C${k + 1} = (${fmt(c[0])}, ${fmt(c[1])})`).join("<br>") + `</div></div>`;
      html += renderWCSSCalculation(frame.centroids, frame.assignments, "Final WCSS calculation");
      html += `<div class="stat-grid">
        <div class="stat"><div class="k">Iterations</div><div class="v">${frame.iteration}</div></div>
        <div class="stat"><div class="k">Final WCSS</div><div class="v">${fmt(frame.wcss)}</div></div>
      </div>`;
      html += `<div class="note">This is what the Elbow and Silhouette methods use across many values of K — here you're seeing WCSS settle for one fixed K = ${K}.</div>`;
    }
    mathPanel.innerHTML = html;

    if (frame.type === "pp-select") {
      bindKMeansPPTableRows(frame);
    }

    if (frame.type === "elbow-result" || frame.type === "elbow-done") {
      bindElbowEducationalControls(frame);
    }
  }

  function bindElbowEducationalControls(frame) {
    mathPanel.querySelectorAll("[data-elbow-k]").forEach(button => {
      button.addEventListener("click", () => {
        const k = Number(button.getAttribute("data-elbow-k"));
        selectElbowK(k);
      });
    });

    mathPanel.querySelectorAll("[data-elbow-point-toggle]").forEach(button => {
      button.addEventListener("click", () => {
        const pointIndex = button.getAttribute("data-elbow-point-toggle");
        const detail = mathPanel.querySelector(
          `[data-elbow-point-detail="${pointIndex}"]`
        );

        if (!detail) return;

        const open = detail.style.display !== "none";
        detail.style.display = open ? "none" : "block";

        const label = button.querySelector("span:last-child");
        if (label) {
          label.textContent = open
            ? "Show calculation ▾"
            : "Hide calculation ▴";
        }
      });
    });

    mathPanel.querySelectorAll("[data-elbow-action]").forEach(button => {
      button.addEventListener("click", () => {
        const action = button.getAttribute("data-elbow-action");
        mathPanel.querySelectorAll(".elbow-point-detail").forEach(detail => {
          detail.style.display = action === "expand" ? "block" : "none";
        });

        mathPanel.querySelectorAll(".elbow-point-toggle span:last-child").forEach(label => {
          label.textContent =
            action === "expand" ? "Hide calculation ▴" : "Show calculation ▾";
        });
      });
    });
  }

  function selectElbowK(k) {
    const index = frames.findIndex(
      frame =>
        frame.type === "elbow-result" &&
        frame.currentK === k
    );

    if (index >= 0) {
      stopPlaying();
      goTo(index, false);
    }
  }

  // ---------------------------------------------------------------
  // 8. ANIMATION
  // ---------------------------------------------------------------
  let currentIdx = 0;
  let silhouetteSelectedPoint = 0;
  let silhouetteShowAll = false;

  // Educational K-Means++ point selection.
  // This is UI state only; it never changes the algorithm state.
  let ppSelectedPoint = 0;

  let playing = false;
  let timer = null;
  let playGeneration = 0;

  function lerp(a, b, t) { return a + (b - a) * t; }

  function animateCentroidsTo(targetCentroids, duration) {
    const startPositions = centroidEls.map(ce => {
      const m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(ce.g.getAttribute("transform") || "");
      return m ? [parseFloat(m[1]), parseFloat(m[2])] : [sx(targetCentroids[0][0]), sy(targetCentroids[0][1])];
    });
    const targetPx = targetCentroids.map(c => [sx(c[0]), sy(c[1])]);
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      centroidEls.forEach((ce, k) => {
        if (k >= K) return;
        const from = startPositions[k] && !isNaN(startPositions[k][0]) ? startPositions[k] : targetPx[k];
        const x = lerp(from[0], targetPx[k][0], ease);
        const y = lerp(from[1], targetPx[k][1], ease);
        ce.g.setAttribute("transform", `translate(${x},${y})`);
      });
      updateLinks(targetCentroids, t);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function updateLinks(centroidsNow, alpha) {
    const frame = frames[currentIdx];
    if (!frame.assignments) {
      linkEls.forEach(l => l.setAttribute("opacity", 0));
      return;
    }
    POINTS.forEach((p, i) => {
      if (i >= linkEls.length) return;
      const k = frame.assignments[i];
      if (k >= K || k >= centroidsNow.length) return;
      const c = centroidsNow[k];
      linkEls[i].setAttribute("x1", sx(p.x));
      linkEls[i].setAttribute("y1", sy(p.y));
      linkEls[i].setAttribute("x2", sx(c[0]));
      linkEls[i].setAttribute("y2", sy(c[1]));
      linkEls[i].setAttribute("stroke", CLUSTER_COLORS_SOLID_LIGHT[k]);
      linkEls[i].setAttribute("opacity", 0.5);
    });
  }

  function renderFrame(idx, opts) {
    opts = opts || {};
    const frame = frames[idx];
    currentIdx = idx;

    const mode = document.getElementById("modeSelect").value;

    // Handle Elbow/Silhouette modes
    if (mode === "elbow") {
      renderElbowFrame(frame, idx);
      return;
    } else if (mode === "silhouette") {
      renderSilhouetteFrame(frame, idx);
      return;
    }

    // Original K-Means rendering
    ensureClusterSvgLayers();
    legendEl.style.display = "";

    // Point colors
    if (frame.type === "pp-select") {
      POINTS.forEach((p, i) => {
        if (i >= pointEls.length) return;
        if (i === frame.chosenIndex) {
          pointEls[i].setAttribute("fill", "#DC2626");
          pointEls[i].setAttribute("r", 12);
          pointEls[i].setAttribute("stroke", "#7F1D1D");
        } else {
          pointEls[i].setAttribute("fill", "#6B7280");
          pointEls[i].setAttribute("stroke", "#374151");
          pointEls[i].setAttribute("r", frame.probs ? (8 + frame.probs[i] * 18) : 10);
        }
      });
    } else {
      POINTS.forEach((p, i) => {
        if (i >= pointEls.length) return;
        const k = frame.assignments ? frame.assignments[i] : null;
        pointEls[i].setAttribute("fill", k === null ? "#6B7280" : CLUSTER_COLORS_SOLID_LIGHT[k]);
        pointEls[i].setAttribute("stroke", k === null ? "#374151" : "#111827");
        pointEls[i].setAttribute("r", k === null ? 10 : 11);
      });
    }

    // K-Means++ educational distance overlay.
    if (frame.type === "pp-select") {
      renderKMeansPPDistanceOverlay(frame, ppSelectedPoint);
    } else {
      linkLayer.innerHTML = "";
    }

    // Centroid visibility
    const visibleCount = frame.visibleCount !== undefined ? frame.visibleCount : K;
    centroidEls.forEach((ce, k) => {
      ce.g.style.opacity = k < visibleCount ? 1 : 0;
    });

    // Centroids
    if (opts.animate) {
      animateCentroidsTo(frame.centroids, 650);
    } else {
      frame.centroids.forEach((c, k) => {
        if (k >= K) return;
        centroidEls[k].g.setAttribute("transform", `translate(${sx(c[0])},${sy(c[1])})`);
      });
      updateLinks(frame.centroids, 1);
    }

    // Update legend
    legendEl.innerHTML = Array.from({length: K}, (_, k) => {
      const colorIdx = k % CLUSTER_COLORS_SOLID_LIGHT.length;
      return `<span class="item"><span class="dot" style="background:${CLUSTER_COLORS_SOLID_LIGHT[colorIdx]};"></span>Cluster ${k + 1}</span>`;
    }).join("") + `<span class="item"><span class="dot" style="background:#6B7280;"></span>Unassigned</span>`;

    renderMathPanel(frame);
    renderWcssChart(idx);

    document.getElementById("stepSub").textContent = `step ${idx} of ${frames.length - 1}`;
    document.getElementById("progressFill").style.width = `${(idx / (frames.length - 1)) * 100}%`;
    document.getElementById("btnPrev").disabled = idx === 0;
    document.getElementById("btnNext").disabled = idx === frames.length - 1;
    if (idx === frames.length - 1) stopPlaying();
  }

  function goTo(idx, animate) {
    idx = Math.max(0, Math.min(frames.length - 1, idx));
    renderFrame(idx, { animate: animate });
  }

  function next() { if (currentIdx < frames.length - 1) goTo(currentIdx + 1, true); }
  function prev() { if (currentIdx > 0) goTo(currentIdx - 1, false); }

  function startPlaying() {
    if (!frames || frames.length <= 1) return;

    // Every new playback session gets a unique token.
    // Any timer from an older session becomes invalid.
    const myGeneration = ++playGeneration;

    if (currentIdx >= frames.length - 1) {
      goTo(0, false);
    }

    playing = true;
    document.getElementById("btnPlay").innerHTML = "⏸ Pause";
    scheduleNextStep(myGeneration);
  }

  function scheduleNextStep(generation = playGeneration) {
    clearTimeout(timer);

    if (!playing || generation !== playGeneration) return;

    if (currentIdx >= frames.length - 1) {
      stopPlaying();
      return;
    }

    const speed = parseInt(document.getElementById("speed").value, 10);

    timer = setTimeout(() => {
      // This callback is stale if the user changed mode, data, K,
      // initialization, or manually stopped playback.
      if (!playing || generation !== playGeneration) return;

      next();

      if (!playing || generation !== playGeneration ||
          currentIdx >= frames.length - 1) {
        stopPlaying();
        return;
      }

      scheduleNextStep(generation);
    }, speed);
  }

  function tick(speed) {
    // Kept for compatibility with any existing calls.
    scheduleNextStep(playGeneration);
  }

  function stopPlaying() {
    // Invalidate every pending callback BEFORE clearing the timer.
    playGeneration++;
    playing = false;
    clearTimeout(timer);
    timer = null;
    document.getElementById("btnPlay").innerHTML = "▶ Play";
  }

    const initSelect = document.getElementById("initMethod");
  const modeSelect = document.getElementById("modeSelect");

  function rebuild() {
    stopPlaying();

    const mode = modeSelect.value;
    updateKControlForMode();

    const isAnalysis = mode === "elbow" || mode === "silhouette";

    document.querySelector(".chart-card.main").style.display = "flex";
    document.querySelector(".chart-card.mini").style.display = isAnalysis ? "none" : "flex";

    if (isAnalysis) {
      initSelect.disabled = true;
      initSelect.style.opacity = "0.5";
    } else {
      initSelect.disabled = false;
      initSelect.style.opacity = "1";
      document.querySelector(".chart-card.mini h3").innerHTML =
        'WCSS (inertia) after each step <span class="sub">lower = tighter clusters</span>';
    }

    frames = buildFrames(initSelect.value);
    currentIdx = 0;
    goTo(0, false);
  }

    modeSelect.addEventListener("change", () => {
    // Selecting a different analysis mode must NEVER inherit
    // playback from the previous mode.
    stopPlaying();

    // Rebuild synchronously at frame 0.
    rebuild();

    // Force the control to remain in the Play state.
    playing = false;
    document.getElementById("btnPlay").innerHTML = "▶ Play";
  });

  // Changing K / Maximum K immediately rebuilds the analysis.
  document.getElementById("kInput").addEventListener("change", () => {
    stopPlaying();
    rebuild();
  });

  function rebuildVisualization() {
    stopPlaying();
    updateKControlForMode();

    // Rebuild frames first, then recalculate the graph bounds from the
    // current data + centroids. This prevents K=4/K=5 centroids from
    // disappearing when their coordinates are outside the old fixed range.
    frames = buildFrames(initSelect.value);
    updateGraphScale();
    renderGrid();

    // Clear existing
    ptLayer.innerHTML = "";
    linkLayer.innerHTML = "";
    centroidLayer.innerHTML = "";

    // Rebuild points
    createPoints();

    // Rebuild links
    linkEls = [];
    POINTS.forEach(() => {
      const l = el("line", { class: "link-line", stroke: "#6B7280", "stroke-width": 2, "stroke-dasharray": "5,4", opacity: 0 });
      linkLayer.appendChild(l);
      linkEls.push(l);
    });

    // Rebuild centroids
    centroidEls = [];
    const currentK = getCurrentK();
    for (let k = 0; k < Math.max(currentK, 6); k++) {
      const g = el("g", { class: "centroid" });
      const colorIdx = k % CLUSTER_COLORS_SOLID_LIGHT.length;
      // Transparent hit target makes the centroid easy to click.
      const hit = el("circle", {
        cx: 0,
        cy: 0,
        r: 24,
        fill: "transparent",
        style: "cursor: pointer;"
      });

      const star = el("path", {
        d: starPath(0, 0, 15),
        fill: CLUSTER_COLORS_SOLID_LIGHT[colorIdx],
        stroke: "#111827",
        "stroke-width": 2.5,
        style: "filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); pointer-events: none;"
      });

      g.appendChild(hit);
      g.appendChild(star);
      centroidLayer.appendChild(g);

      // Show C1/C2/... and its x₁/x₂ coordinates when the centroid
      // is hovered or clicked.
      hit.addEventListener("mouseenter", (e) => {
        const frame = frames[currentIdx];
        const centroid = frame && frame.centroids ? frame.centroids[k] : null;
        showCentroidTooltip(k, e, centroid);
        star.setAttribute("stroke-width", "4");
      });

      hit.addEventListener("mousemove", (e) => {
        updateTooltipPosition(e);
      });

      hit.addEventListener("mouseleave", () => {
        hideTooltip();
        star.setAttribute("stroke-width", "2.5");
      });

      hit.addEventListener("click", (e) => {
        // IMPORTANT: don't let a centroid click fall through to the
        // graph background and create a new data point.
        e.stopPropagation();

        const frame = frames[currentIdx];
        const centroid = frame && frame.centroids ? frame.centroids[k] : null;

        if (centroid) {
          showCentroidTooltip(k, e, centroid);
        }
      });

      centroidEls.push({ g, star, hit });
    }

    // Update dataset info
    document.getElementById("datasetInfo").textContent = `${POINTS.length} points · K = ${currentK}`;

    goTo(0, false);
  }

  // ---------------------------------------------------------------
  // 9. DATA EDITOR
  // ---------------------------------------------------------------

    POINTS.forEach((p, idx) => {

      div.className = "point-input";
      div.innerHTML = `

      input.addEventListener("change", (e) => {
        const idx = parseInt(e.target.dataset.idx);

  function getAnalysisMaxK(mode) {
    // Elbow can include K=1. Silhouette starts at K=2.
    const maxAllowed = Math.min(Math.max(1, POINTS.length - 1), 6);
    const input = document.getElementById("kInput");

    let requested = parseInt(input.value, 10);
    if (!Number.isFinite(requested)) {
      requested = Math.min(6, maxAllowed);
    }

    const minK = mode === "silhouette" ? 2 : 1;
    const safeMax = Math.max(minK, Math.min(maxAllowed, requested));

    input.min = String(minK);
    input.max = String(maxAllowed);
    input.value = String(safeMax);

    return safeMax;
  }

  function updateKControlForMode() {
    const mode = document.getElementById("modeSelect").value;
    const groupTitle = document.querySelector(".k-input-group h3");
    const groupLabel = document.querySelector(".k-input-wrapper label");
    const input = document.getElementById("kInput");

    if (mode === "elbow" || mode === "silhouette") {
      groupTitle.textContent = "Maximum K to Test";
      groupLabel.textContent = "Max K =";

      const maxAllowed = Math.min(Math.max(1, POINTS.length - 1), 6);
      input.max = String(maxAllowed);
      input.min = mode === "silhouette" ? "2" : "1";

      let value = parseInt(input.value, 10);
      if (!Number.isFinite(value)) value = maxAllowed;
      value = Math.max(parseInt(input.min, 10), Math.min(maxAllowed, value));
      input.value = String(value);
    } else {
      groupTitle.textContent = "Number of Clusters";
      groupLabel.textContent = "K =";
      input.min = "1";
      input.max = String(Math.min(POINTS.length, 6));

      let value = parseInt(input.value, 10);
      if (!Number.isFinite(value)) value = 3;
      value = Math.max(1, Math.min(parseInt(input.max, 10), value));
      input.value = String(value);
    }
  }

  // Build step-by-step frames for Elbow Method
  function buildElbowEducationalData(result, runs) {
    const { k, centroids, assignments, wcss } = result;

    const clusterBreakdowns = centroids.map((centroid, clusterIndex) => {
      const memberIndices = POINTS
        .map((_, i) => i)
        .filter(i => assignments[i] === clusterIndex);

      const points = memberIndices.map(pointIndex => {
        const point = POINTS[pointIndex];
        const dx = point.x - centroid[0];
        const dy = point.y - centroid[1];
        const dxSquared = dx * dx;
        const dySquared = dy * dy;
        const squaredDistance = dxSquared + dySquared;

        return {
          pointIndex,
          point: { ...point },
          dx,
          dy,
          dxSquared,
          dySquared,
          squaredDistance
        };
      });

      const clusterWCSS = points.reduce(
        (sum, p) => sum + p.squaredDistance,
        0
      );

      // Store the actual mean calculation used to produce the centroid.
      const count = memberIndices.length;
      const xValues = memberIndices.map(i => POINTS[i].x);
      const yValues = memberIndices.map(i => POINTS[i].y);
      const sumX = xValues.reduce((s, x) => s + x, 0);
      const sumY = yValues.reduce((s, y) => s + y, 0);

      return {
        clusterIndex,
        centroid: centroid.slice(),
        pointIndices: memberIndices.slice(),
        points,
        clusterWCSS,
        centroidCalculation: {
          count,
          xValues,
          yValues,
          sumX,
          sumY,
          meanX: count ? sumX / count : centroid[0],
          meanY: count ? sumY / count : centroid[1]
        }
      };
    });

    const selectedRunIndex =
      Number.isInteger(result.selectedRunIndex)
        ? result.selectedRunIndex
        : 0;

    const runSummaries = runs.map((run, index) => ({
      run: index + 1,
      wcss: run.wcss,
      selected: index === selectedRunIndex
    }));

    return {
      k,
      wcss,
      centroids: centroids.map(c => c.slice()),
      assignments: assignments.slice(),
      clusterBreakdowns,
      runSummaries,
      selectedRunIndex: selectedRunIndex + 1
    };
  }

  // Build step-by-step frames for Elbow Method.
  // The K-Means/WCSS engine itself is unchanged.
  function buildElbowFrames() {
    const maxK = getAnalysisMaxK("elbow");
    const built = [];

    built.push({
      type: "elbow-intro",
      step: 0,
      totalSteps: maxK,
      results: [],
      currentK: null
    });

    const allResults = [];

    for (let k = 1; k <= maxK; k++) {
      const runs = [];

      for (let run = 0; run < 5; run++) {
        runs.push(runKMeansForK(k));
      }

      let bestIndex = 0;
      for (let i = 1; i < runs.length; i++) {
        if (runs[i].wcss < runs[bestIndex].wcss) {
          bestIndex = i;
        }
      }

      const best = {
        ...runs[bestIndex],
        selectedRunIndex: bestIndex
      };

      const educational = buildElbowEducationalData(
        { k, ...best },
        runs
      );

      allResults.push(educational);

      built.push({
        type: "elbow-result",
        step: k,
        totalSteps: maxK,
        currentK: k,
        results: allResults.slice(),
        wcss: educational.wcss,
        centroids: educational.centroids,
        assignments: educational.assignments,
        clusterBreakdowns: educational.clusterBreakdowns,
        runSummaries: educational.runSummaries,
        selectedRunIndex: educational.selectedRunIndex
      });
    }

    built.push({
      type: "elbow-done",
      step: maxK + 1,
      results: allResults.slice(),
      elbowK: findElbowPoint(allResults),
      totalSteps: maxK
    });

    return built;
  }

  function buildSilhouetteFrames() {
    const maxK = getAnalysisMaxK("silhouette");
    const built = [];
    const totalTests = Math.max(0, maxK - 1);

    // Frame 0: introduction.
    built.push({
      type: "silhouette-intro",
      step: 0,
      totalSteps: totalTests,
      results: [],
      currentK: null
    });

    if (maxK < 2) {
      built.push({
        type: "silhouette-done",
        results: [],
        bestK: "N/A",
        bestScore: 0,
        totalSteps: 0
      });
      return built;
    }

    const allResults = [];

    // ONE FRAME PER K.
    for (let k = 2; k <= maxK; k++) {
      const runs = [];

      for (let run = 0; run < 5; run++) {
        runs.push(runKMeansForK(k));
      }

      const best = runs.reduce(
        (a, b) => a.wcss < b.wcss ? a : b
      );

      const silhouette = calculateSilhouetteScore(
        best.assignments,
        k
      );

      allResults.push({
        k,
        wcss: best.wcss,
        silhouette,
        centroids: best.centroids,
        assignments: best.assignments
      });

      built.push({
        type: "silhouette-result",
        step: k - 1,
        totalSteps: totalTests,
        currentK: k,
        results: allResults.slice(),
        silhouette,
        centroids: best.centroids,
        assignments: best.assignments
      });
    }

    const bestK = allResults.reduce(
      (a, b) => a.silhouette > b.silhouette ? a : b,
      allResults[0]
    );

    // Final frame: complete curve + best K.
    built.push({
      type: "silhouette-done",
      step: totalTests + 1,
      results: allResults.slice(),
      bestK: bestK ? bestK.k : "N/A",
      bestScore: bestK ? bestK.silhouette : 0,
      totalSteps: totalTests
    });

    return built;
  }

  function findElbowPoint(results) {
    if (!results.length) return 1;
    if (results.length <= 2) return results[results.length - 1].k;

    const kValues = results.map(r => r.k);
    const wcssValues = results.map(r => r.wcss);
    const minK = Math.min(...kValues);
    const maxK = Math.max(...kValues);
    const minWCSS = Math.min(...wcssValues);
    const maxWCSS = Math.max(...wcssValues);

    const normalize = (r) => ({
      k: r.k,
      x: (r.k - minK) / (maxK - minK || 1),
      y: (r.wcss - minWCSS) / (maxWCSS - minWCSS || 1)
    });

    const start = normalize(results[0]);
    const end = normalize(results[results.length - 1]);
    const denom = Math.hypot(end.x - start.x, end.y - start.y) || 1;
    let elbowK = results[1].k;
    let bestDistance = -Infinity;

    for (let i = 1; i < results.length - 1; i++) {
      const point = normalize(results[i]);
      const distance = Math.abs(
        (end.x - start.x) * (start.y - point.y) -
        (start.x - point.x) * (end.y - start.y)
      ) / denom;

      if (distance > bestDistance) {
        bestDistance = distance;
        elbowK = point.k;
      }
    }

    return elbowK;
  }

  function runKMeansForK(k, maxIter = 20) {
    // Run K-Means for a specific K value and return final WCSS and assignments
    let centroids = [];

    // Random initialization
    const shuffled = shuffledPoints();
    for (let i = 0; i < k; i++) {
      centroids.push([shuffled[i].x, shuffled[i].y]);
    }

    let assignments = [];

    for (let iter = 0; iter < maxIter; iter++) {
      // Assign
      const distances = POINTS.map(p => centroids.map(c => dist([p.x, p.y], c)));
      const newAssignments = distances.map(d => d.indexOf(Math.min(...d)));

      // Check convergence
      if (iter > 0 && newAssignments.every((a, i) => a === assignments[i])) {
        break;
      }

      assignments = newAssignments;

      // Update
      centroids = centroids.map((c, ki) => {
        const members = POINTS.filter((_, i) => assignments[i] === ki);
        return members.length ? mean(members) : c.slice();
      });
    }

    const wcss = computeWCSS(centroids, assignments);
    return { wcss, assignments, centroids };
  }

  function calculateSilhouetteScore(assignments, k) {
    if (k === 1) return 0;

    const silhouettes = POINTS.map((p, i) => {
      const myCluster = assignments[i];

      // a(i): mean distance to points in same cluster
      const sameCluster = POINTS.filter((_, j) => assignments[j] === myCluster && j !== i);
      if (sameCluster.length === 0) return 0;

      const a = sameCluster.reduce((sum, q) => sum + dist([p.x, p.y], [q.x, q.y]), 0) / sameCluster.length;

      // b(i): mean distance to points in nearest different cluster
      let minB = Infinity;
      for (let otherCluster = 0; otherCluster < k; otherCluster++) {
        if (otherCluster === myCluster) continue;
        const otherPoints = POINTS.filter((_, j) => assignments[j] === otherCluster);
        if (otherPoints.length === 0) continue;

        const b = otherPoints.reduce((sum, q) => sum + dist([p.x, p.y], [q.x, q.y]), 0) / otherPoints.length;
        minB = Math.min(minB, b);
      }

      if (minB === Infinity) return 0;

      // s(i) = (b - a) / max(a, b)
      return (minB - a) / Math.max(a, minB);
    });

    return silhouettes.reduce((sum, s) => sum + s, 0) / silhouettes.length;
  }

  function analyzeOptimalK() {
    const maxK = Math.min(POINTS.length - 1, 6);
    const results = [];

    // Run K-Means for K = 1 to maxK
    for (let k = 1; k <= maxK; k++) {
      const runs = [];
      // Run multiple times and take best result (to handle randomness)
      for (let run = 0; run < 5; run++) {
        runs.push(runKMeansForK(k));
      }

      // Pick run with lowest WCSS
      const best = runs.reduce((a, b) => a.wcss < b.wcss ? a : b);
      const silhouette = k > 1 ? calculateSilhouetteScore(best.assignments, k) : 0;

      results.push({ k, wcss: best.wcss, silhouette });
    }

    return results;
  }

  function drawElbowChart(results) {
    const svg = document.getElementById("elbowSvg");
    const W = 500, H = 300, PAD = 60;
    svg.innerHTML = "";

    const maxWCSS = Math.max(1, Math.max(...results.map(r => r.wcss)) * 1.05);
    const minWCSS = 0;
    const wcssRange = maxWCSS - minWCSS || 1;

    const sx = (k) => PAD + ((k - 1) / Math.max(1, results.length - 1)) * (W - 2 * PAD);
    const sy = (wcss) => H - PAD - ((wcss - minWCSS) / wcssRange) * (H - 2 * PAD);

    // Grid
    const g = el("g", {});
    for (let i = 0; i < results.length; i++) {
      const k = results[i].k;
      g.appendChild(el("line", {
        x1: sx(k), y1: H - PAD, x2: sx(k), y2: PAD - 20,
        stroke: "#E5E7EB", "stroke-width": 1
      }));
      g.appendChild(el("text", {
        x: sx(k), y: H - PAD + 20,
        "text-anchor": "middle",
        "font-size": 13,
        fill: "#374151",
        "font-family": "IBM Plex Sans",
        "font-weight": "600"
      })).textContent = k;
    }

    // Y-axis lines
    for (let i = 0; i <= 4; i++) {
      const wcss = minWCSS + (wcssRange * i / 4);
      const y = sy(wcss);
      g.appendChild(el("line", {
        x1: PAD, y1: y, x2: W - 20, y2: y,
        stroke: "#E5E7EB", "stroke-width": 1

        "font-size": 12,
        fill: "#374151",
        "font-family": "IBM Plex Mono"

    }
    svg.appendChild(g);

    // Axes
    svg.appendChild(el("line", {
      x1: PAD, y1: H - PAD, x2: W - 20, y2: H - PAD,
      stroke: "#374151", "stroke-width": 2
    }));
    svg.appendChild(el("line", {
      x1: PAD, y1: H - PAD, x2: PAD, y2: PAD - 20,
      stroke: "#374151", "stroke-width": 2

    // Labels

      fill: "#111827",
      "font-weight": "700"

    xLabel.textContent = "Number of Clusters (K)";

    const yLabel = el("text", {

  function findOptimalK(results) {

    // Find best silhouette
    const validResults = results.filter(r => r.k > 1);
    const bestSilhouette = validResults.reduce((a, b) => a.silhouette > b.silhouette ? a : b);

    return { elbowK, silhouetteK: bestSilhouette.k, bestSilhouette: bestSilhouette.silhouette };

        fill: "#111827", "font-weight": "700"
      });
      xLabel.textContent = "Number of Clusters (K)";
      mainSvg.appendChild(xLabel);

      const yLabel = el("text", {
        x: 22, y: H / 2,
        "text-anchor": "middle", "font-size": 15,
        fill: "#111827", "font-weight": "700",
        transform: `rotate(-90 22 ${H / 2})`
      });
      yLabel.textContent = "WCSS (Within-Cluster Sum of Squares)";
      mainSvg.appendChild(yLabel);

      // Line
      if (results.length > 1) {
        let pathD = "";
        results.forEach((r, i) => {
          pathD += (i === 0 ? "M" : "L") + sx(r.k) + "," + sy(r.wcss) + " ";
        });
        mainSvg.appendChild(el("path", {
          d: pathD, fill: "none", stroke: "#EC4899", "stroke-width": 4
        }));
      }

      // Points
      results.forEach((r, i) => {
        const isElbow = frame.type === "elbow-done" && r.k === frame.elbowK;
        const isCurrent = frame.type === "elbow-result" && r.k === frame.currentK;

        const pointCircle = el("circle", {
          cx: sx(r.k), cy: sy(r.wcss),
          r: isElbow ? 12 : (isCurrent ? 10 : 8),
          fill: isElbow ? "#10B981" : (isCurrent ? "#EC4899" : "#EC4899"),
          stroke: "#FFFFFF", "stroke-width": 3,
          style: "cursor:pointer"
        });

        pointCircle.addEventListener("click", (e) => {
          e.stopPropagation();
          selectElbowK(r.k);
        });

        pointCircle.addEventListener("mouseenter", () => {
          pointCircle.setAttribute("r", isElbow ? 14 : 12);
        });

        pointCircle.addEventListener("mouseleave", () => {
          pointCircle.setAttribute("r", isElbow ? 12 : (isCurrent ? 10 : 8));
        });

        mainSvg.appendChild(pointCircle);

        // Value label
        const t = el("text", {
          x: sx(r.k), y: sy(r.wcss) - 20,
          "text-anchor": "middle", "font-size": 13,
          fill: isElbow ? "#10B981" : "#EC4899",
          "font-family": "IBM Plex Mono", "font-weight": "700"
        });
        t.textContent = r.wcss.toFixed(2);
        t.style.cursor = "pointer";
        t.addEventListener("click", (e) => {
          e.stopPropagation();
          selectElbowK(r.k);
        });
        mainSvg.appendChild(t);

        if (isElbow) {
          const elbowLabel = el("text", {
            x: sx(r.k), y: sy(r.wcss) + 30,
            "text-anchor": "middle", "font-size": 15,
            fill: "#10B981", "font-family": "IBM Plex Sans", "font-weight": "700"
          });
          elbowLabel.textContent = "← ELBOW";
          mainSvg.appendChild(elbowLabel);
        }
      });
    }

    renderMathPanel(frame);
    const last = Math.max(1, frames.length - 1);

    if (frame.type === "elbow-result") {
      document.getElementById("stepSub").textContent =
        `K = ${frame.currentK} · step ${idx} of ${last}`;
    } else if (frame.type === "silhouette-result") {
      document.getElementById("stepSub").textContent =
        `K = ${frame.currentK} · step ${idx} of ${last}`;
    } else {
      document.getElementById("stepSub").textContent =
        `step ${idx} of ${last}`;
    }
    document.getElementById("progressFill").style.width = `${(idx / last) * 100}%`;
    document.getElementById("btnPrev").disabled = idx === 0;
    document.getElementById("btnNext").disabled = idx === frames.length - 1;
    if (idx === frames.length - 1) stopPlaying();
  }

  function renderSilhouetteFrame(frame, idx) {
    // Show only main chart, hide mini
    document.querySelector('.chart-card.main').style.display = 'flex';
    document.querySelector('.chart-card.mini').style.display = 'none';
    legendEl.style.display = "none";

    // Update main chart to show silhouette analysis
    document.querySelector('.chart-card.main h3').innerHTML = 'Silhouette Analysis <span class="sub">Score vs Number of Clusters (K)</span>';
    const mainSvg = document.getElementById("mainSvg");
    mainSvg.innerHTML = "";

    if (frame.results && frame.results.length > 0) {
      const results = frame.results;
      const W = 800, H = 600, PAD = 80;

      const maxScore = 1;
      const minScore = -1;
      const scoreRange = maxScore - minScore;

      const minK = Math.min(...results.map(r => r.k));
      const maxK = Math.max(...results.map(r => r.k));

      const sx = (k) =>
        PAD +
        ((k - minK) / Math.max(1, maxK - minK)) *
        (W - 2 * PAD);
      const sy = (score) => H - PAD - ((score - minScore) / scoreRange) * (H - 2 * PAD);

      // Score interpretation zones sit behind the plotted line and points.
      const zoneLayer = el("g", {});
      [
        { min: 0.7, max: 1, color: "#D1FAE5" },
        { min: 0.5, max: 0.7, color: "#FEF3C7" },
        { min: 0.25, max: 0.5, color: "#FED7AA" }
      ].forEach(zone => {
        const yTop = sy(zone.max);
        const yBottom = sy(zone.min);
        zoneLayer.appendChild(el("rect", {
          x: PAD, y: yTop,
          width: W - 2 * PAD + 20, height: yBottom - yTop,
          fill: zone.color, opacity: 0.2
        }));
      });
      mainSvg.appendChild(zoneLayer);

      // Grid
      const g = el("g", {});
      for (let k = minK; k <= maxK; k++) {
        g.appendChild(el("line", {
          x1: sx(k), y1: H - PAD, x2: sx(k), y2: PAD - 20,
          stroke: "#E5E7EB", "stroke-width": 1
        }));
        g.appendChild(el("text", {
          x: sx(k), y: H - PAD + 24,
          "text-anchor": "middle", "font-size": 16,
          fill: "#374151", "font-family": "IBM Plex Sans", "font-weight": "600"
        })).textContent = k;
      }

      // Y-axis grid and labels
      for (let i = 0; i <= 5; i++) {
        const score = minScore + (scoreRange * i / 5);
        const y = sy(score);
        g.appendChild(el("line", {
          x1: PAD, y1: y, x2: W - PAD + 20, y2: y,
          stroke: "#E5E7EB", "stroke-width": 1
        }));
        g.appendChild(el("text", {
          x: PAD - 16, y: y + 5,
          "text-anchor": "end", "font-size": 14,
          fill: "#374151", "font-family": "IBM Plex Mono", "font-weight": "600"
        })).textContent = score.toFixed(2);
      }
      mainSvg.appendChild(g);

      // Axes
      mainSvg.appendChild(el("line", {
        x1: PAD, y1: H - PAD, x2: W - PAD + 20, y2: H - PAD,
        stroke: "#374151", "stroke-width": 2.5
      }));
      mainSvg.appendChild(el("line", {
        x1: PAD, y1: H - PAD, x2: PAD, y2: PAD - 20,
        stroke: "#374151", "stroke-width": 2.5
      }));

      // Axis labels
      const xLabel = el("text", {
        x: W / 2, y: H - 18,
        "text-anchor": "middle", "font-size": 15,
        fill: "#111827", "font-weight": "700"
      });
      xLabel.textContent = "Number of Clusters (K)";
      mainSvg.appendChild(xLabel);

      const yLabel = el("text", {
        x: 22, y: H / 2,
        "text-anchor": "middle", "font-size": 15,
        fill: "#111827", "font-weight": "700",
        transform: `rotate(-90 22 ${H / 2})`
      });
      yLabel.textContent = "Silhouette Score";
      mainSvg.appendChild(yLabel);

      // Line
      if (results.length > 1) {
        let pathD = "";
        results.forEach((r, i) => {
          pathD += (i === 0 ? "M" : "L") + sx(r.k) + "," + sy(r.silhouette) + " ";
        });
        mainSvg.appendChild(el("path", {
          d: pathD, fill: "none", stroke: "#8B5CF6", "stroke-width": 4
        }));
      }

      // Points
      results.forEach((r, i) => {
        const isBest = frame.type === "silhouette-done" && r.k === frame.bestK;
        const isCurrent = frame.type === "silhouette-result" && r.k === frame.currentK;

        mainSvg.appendChild(el("circle", {
          cx: sx(r.k), cy: sy(r.silhouette),
          r: isBest ? 12 : (isCurrent ? 10 : 8),
          fill: isBest ? "#10B981" : (isCurrent ? "#8B5CF6" : "#8B5CF6"),
          stroke: "#FFFFFF", "stroke-width": 3
        }));

        // Value label
        const t = el("text", {
          x: sx(r.k), y: sy(r.silhouette) - 20,
          "text-anchor": "middle", "font-size": 13,
          fill: isBest ? "#10B981" : "#8B5CF6",
          "font-family": "IBM Plex Mono", "font-weight": "700"
        });
        t.textContent = r.silhouette.toFixed(3);
        mainSvg.appendChild(t);

        if (isBest) {
          const bestLabel = el("text", {
            x: sx(r.k), y: sy(r.silhouette) + 30,
            "text-anchor": "middle", "font-size": 15,
            fill: "#10B981", "font-family": "IBM Plex Sans", "font-weight": "700"
          });
          bestLabel.textContent = "← BEST";
          mainSvg.appendChild(bestLabel);
        }
      });
    }

    renderMathPanel(frame);
    const last = Math.max(1, frames.length - 1);

    if (frame.type === "elbow-result") {
      document.getElementById("stepSub").textContent =
        `K = ${frame.currentK} · step ${idx} of ${last}`;
    } else if (frame.type === "silhouette-result") {
      document.getElementById("stepSub").textContent =
        `K = ${frame.currentK} · step ${idx} of ${last}`;
    } else {
      document.getElementById("stepSub").textContent =
        `step ${idx} of ${last}`;
    }
    document.getElementById("progressFill").style.width = `${(idx / last) * 100}%`;
    document.getElementById("btnPrev").disabled = idx === 0;
    document.getElementById("btnNext").disabled = idx === frames.length - 1;
    if (idx === frames.length - 1) stopPlaying();
  }

  // ---------------------------------------------------------------
  // 11. EVENT LISTENERS
  // ---------------------------------------------------------------
  document.getElementById("btnNext").addEventListener("click", () => { stopPlaying(); next(); });
  document.getElementById("btnPrev").addEventListener("click", () => { stopPlaying(); prev(); });
  document.getElementById("btnReset").addEventListener("click", () => {
    stopPlaying();
    rebuild();
  });

  initSelect.addEventListener("change", () => {
    stopPlaying();
    rebuild();
  });
  document.getElementById("btnPlay").addEventListener("click", () => {
    if (playing) stopPlaying(); else startPlaying();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { stopPlaying(); next(); }
    if (e.key === "ArrowLeft") { stopPlaying(); prev(); }
    if (e.key === " ") { e.preventDefault(); if (playing) stopPlaying(); else startPlaying(); }
  });

  // Modal controls
  const modal = document.getElementById("modalOverlay");
  const btnEditData = document.getElementById("btnEditData");
  const closeModal = document.getElementById("closeModal");
  const applyChanges = document.getElementById("applyChanges");

  btnEditData.addEventListener("click", () => {
    renderDataEditor();
    modal.classList.add("active");
  });

  closeModal.addEventListener("click", () => {
    modal.classList.remove("active");
  });

  applyChanges.addEventListener("click", () => {
    modal.classList.remove("active");
    rebuildVisualization();
  });

  modal.addEventListener("click", (e) => {
    if (e.target === modal) {
      modal.classList.remove("active");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("active")) {
      modal.classList.remove("active");
    }
  });

  // Initial paint
  updateKControlForMode();
  renderDataEditor();
  goTo(0, false);
})();
</script>
</body>
</html>
