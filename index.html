      const x = sx(r.k);
      const y = sy(r.silhouette);
      svg.appendChild(el("circle", {
        cx: x, cy: y, r: 5,
        fill: "#8B5CF6",
        stroke: "#FFFFFF",
        "stroke-width": 2
      }));
    });
  }

  function findOptimalK(results) {
    const elbowK = findElbowPoint(results);

    // Find best silhouette
    const validResults = results.filter(r => r.k > 1);
    const bestSilhouette = validResults.reduce((a, b) => a.silhouette > b.silhouette ? a : b);

    return { elbowK, silhouetteK: bestSilhouette.k, bestSilhouette: bestSilhouette.silhouette };
  }

  function renderElbowFrame(frame, idx) {
    // Show only main chart, hide mini
    document.querySelector('.chart-card.main').style.display = 'flex';
    document.querySelector('.chart-card.mini').style.display = 'none';
    legendEl.style.display = "none";

    // Update main chart to show elbow analysis
    document.querySelector('.chart-card.main h3').innerHTML = 'Elbow Method <span class="sub">WCSS vs Number of Clusters (K)</span>';
    const mainSvg = document.getElementById("mainSvg");
    mainSvg.innerHTML = "";

    if (frame.results && frame.results.length > 0) {
      const results = frame.results;
      const W = 800, H = 600, PAD = 80;

      const maxWCSS = Math.max(1, Math.max(...results.map(r => r.wcss)) * 1.05);
      const minWCSS = 0;
      const wcssRange = maxWCSS - minWCSS;

      const sx = (k) => PAD + ((k - 1) / Math.max(1, frame.totalSteps - 1)) * (W - 2 * PAD);
      const sy = (wcss) => H - PAD - ((wcss - minWCSS) / wcssRange) * (H - 2 * PAD);

      // Grid
      const g = el("g", {});
      for (let k = 1; k <= frame.totalSteps; k++) {
        g.appendChild(el("line", {
          x1: sx(k), y1: H - PAD, x2: sx(k), y2: PAD - 20,
          stroke: "#E5E7EB", "stroke-width": 1
        }));
        g.appendChild(el("text", {
          x: sx(k), y: H - PAD + 24,
          "text-anchor": "middle", "font-size": 16,
          fill: "#374151", "font-family": "IBM Plex Sans", "font-weight": "600"
        })).textContent = k;
      }

      // Y-axis grid and labels
      for (let i = 0; i <= 5; i++) {
        const wcss = minWCSS + (wcssRange * i / 5);
        const y = sy(wcss);
        g.appendChild(el("line", {
          x1: PAD, y1: y, x2: W - PAD + 20, y2: y,
          stroke: "#E5E7EB", "stroke-width": 1
        }));
        g.appendChild(el("text", {
          x: PAD - 16, y: y + 5,
          "text-anchor": "end", "font-size": 14,
          fill: "#374151", "font-family": "IBM Plex Mono", "font-weight": "600"
        })).textContent = wcss.toFixed(1);
      }
      mainSvg.appendChild(g);

      // Axes
      mainSvg.appendChild(el("line", {
        x1: PAD, y1: H - PAD, x2: W - PAD + 20, y2: H - PAD,
        stroke: "#374151", "stroke-width": 2.5
      }));
      mainSvg.appendChild(el("line", {
        x1: PAD, y1: H - PAD, x2: PAD, y2: PAD - 20,
        stroke: "#374151", "stroke-width": 2.5
      }));

      // Axis labels
      const xLabel = el("text", {
        x: W / 2, y: H - 18,
        "text-anchor": "middle", "font-size": 15,
        fill: "#111827", "font-weight": "700"
      });
      xLabel.textContent = "Number of Clusters (K)";
      mainSvg.appendChild(xLabel);

      const yLabel = el("text", {
        x: 22, y: H / 2,
        "text-anchor": "middle", "font-size": 15,
        fill: "#111827", "font-weight": "700",
        transform: `rotate(-90 22 ${H / 2})`
      });
      yLabel.textContent = "WCSS (Within-Cluster Sum of Squares)";
      mainSvg.appendChild(yLabel);

      // Line
      if (results.length > 1) {
        let pathD = "";
        results.forEach((r, i) => {
          pathD += (i === 0 ? "M" : "L") + sx(r.k) + "," + sy(r.wcss) + " ";
        });
        mainSvg.appendChild(el("path", {
          d: pathD, fill: "none", stroke: "#EC4899", "stroke-width": 4
        }));
      }

      // Points
      results.forEach((r, i) => {
        const isElbow = frame.type === "elbow-done" && r.k === frame.elbowK;
        const isCurrent = frame.type === "elbow-result" && r.k === frame.currentK;

        mainSvg.appendChild(el("circle", {
          cx: sx(r.k), cy: sy(r.wcss),
          r: isElbow ? 12 : (isCurrent ? 10 : 8),
          fill: isElbow ? "#10B981" : (isCurrent ? "#EC4899" : "#EC4899"),
          stroke: "#FFFFFF", "stroke-width": 3
        }));

        // Value label
        const t = el("text", {
          x: sx(r.k), y: sy(r.wcss) - 20,
          "text-anchor": "middle", "font-size": 13,
          fill: isElbow ? "#10B981" : "#EC4899",
          "font-family": "IBM Plex Mono", "font-weight": "700"
        });
        t.textContent = r.wcss.toFixed(2);
        mainSvg.appendChild(t);

        if (isElbow) {
          const elbowLabel = el("text", {
            x: sx(r.k), y: sy(r.wcss) + 30,
            "text-anchor": "middle", "font-size": 15,
            fill: "#10B981", "font-family": "IBM Plex Sans", "font-weight": "700"
          });
          elbowLabel.textContent = "← ELBOW";
          mainSvg.appendChild(elbowLabel);
        }
      });
    }

    renderMathPanel(frame);
    document.getElementById("stepSub").textContent = `step ${idx} of ${frames.length - 1}`;
    document.getElementById("progressFill").style.width = `${(idx / (frames.length - 1)) * 100}%`;
    document.getElementById("btnPrev").disabled = idx === 0;
    document.getElementById("btnNext").disabled = idx === frames.length - 1;
    if (idx === frames.length - 1) stopPlaying();
  }

  function renderSilhouetteFrame(frame, idx) {
    // Show only main chart, hide mini
    document.querySelector('.chart-card.main').style.display = 'flex';
    document.querySelector('.chart-card.mini').style.display = 'none';
    legendEl.style.display = "none";

    // Update main chart to show silhouette analysis
    document.querySelector('.chart-card.main h3').innerHTML = 'Silhouette Analysis <span class="sub">Score vs Number of Clusters (K)</span>';
    const mainSvg = document.getElementById("mainSvg");
    mainSvg.innerHTML = "";

    if (frame.results && frame.results.length > 0) {
      const results = frame.results;
      const W = 800, H = 600, PAD = 80;

      const maxScore = 1;
      const minScore = -1;
      const scoreRange = maxScore - minScore;

      const sx = (k) => PAD + ((k - 2) / Math.max(1, frame.totalSteps - 1)) * (W - 2 * PAD);
      const sy = (score) => H - PAD - ((score - minScore) / scoreRange) * (H - 2 * PAD);

      // Score interpretation zones sit behind the plotted line and points.
      const zoneLayer = el("g", {});
      [
        { min: 0.7, max: 1, color: "#D1FAE5" },
        { min: 0.5, max: 0.7, color: "#FEF3C7" },
        { min: 0.25, max: 0.5, color: "#FED7AA" }
      ].forEach(zone => {
        const yTop = sy(zone.max);
        const yBottom = sy(zone.min);
        zoneLayer.appendChild(el("rect", {
          x: PAD, y: yTop,
          width: W - 2 * PAD + 20, height: yBottom - yTop,
          fill: zone.color, opacity: 0.2
        }));
      });
      mainSvg.appendChild(zoneLayer);

      // Grid
      const g = el("g", {});
      for (let k = 2; k <= frame.totalSteps + 1; k++) {
        g.appendChild(el("line", {
          x1: sx(k), y1: H - PAD, x2: sx(k), y2: PAD - 20,
          stroke: "#E5E7EB", "stroke-width": 1
        }));
        g.appendChild(el("text", {
          x: sx(k), y: H - PAD + 24,
          "text-anchor": "middle", "font-size": 16,
          fill: "#374151", "font-family": "IBM Plex Sans", "font-weight": "600"
        })).textContent = k;
      }

      // Y-axis grid and labels
      for (let i = 0; i <= 5; i++) {
        const score = minScore + (scoreRange * i / 5);
        const y = sy(score);
        g.appendChild(el("line", {
          x1: PAD, y1: y, x2: W - PAD + 20, y2: y,
          stroke: "#E5E7EB", "stroke-width": 1
        }));
        g.appendChild(el("text", {
          x: PAD - 16, y: y + 5,
          "text-anchor": "end", "font-size": 14,
          fill: "#374151", "font-family": "IBM Plex Mono", "font-weight": "600"
        })).textContent = score.toFixed(2);
      }
      mainSvg.appendChild(g);

      // Axes
      mainSvg.appendChild(el("line", {
        x1: PAD, y1: H - PAD, x2: W - PAD + 20, y2: H - PAD,
        stroke: "#374151", "stroke-width": 2.5
      }));
      mainSvg.appendChild(el("line", {
        x1: PAD, y1: H - PAD, x2: PAD, y2: PAD - 20,
        stroke: "#374151", "stroke-width": 2.5
      }));

      // Axis labels
      const xLabel = el("text", {
        x: W / 2, y: H - 18,
        "text-anchor": "middle", "font-size": 15,
        fill: "#111827", "font-weight": "700"
      });
      xLabel.textContent = "Number of Clusters (K)";
      mainSvg.appendChild(xLabel);

      const yLabel = el("text", {
        x: 22, y: H / 2,
        "text-anchor": "middle", "font-size": 15,
        fill: "#111827", "font-weight": "700",
        transform: `rotate(-90 22 ${H / 2})`
      });
      yLabel.textContent = "Silhouette Score";
      mainSvg.appendChild(yLabel);

      // Line
      if (results.length > 1) {
        let pathD = "";
        results.forEach((r, i) => {
          pathD += (i === 0 ? "M" : "L") + sx(r.k) + "," + sy(r.silhouette) + " ";
        });
        mainSvg.appendChild(el("path", {
          d: pathD, fill: "none", stroke: "#8B5CF6", "stroke-width": 4
        }));
      }

      // Points
      results.forEach((r, i) => {
        const isBest = frame.type === "silhouette-done" && r.k === frame.bestK;
        const isCurrent = frame.type === "silhouette-result" && r.k === frame.currentK;

        mainSvg.appendChild(el("circle", {
          cx: sx(r.k), cy: sy(r.silhouette),
          r: isBest ? 12 : (isCurrent ? 10 : 8),
          fill: isBest ? "#10B981" : (isCurrent ? "#8B5CF6" : "#8B5CF6"),
          stroke: "#FFFFFF", "stroke-width": 3
        }));

        // Value label
        const t = el("text", {
          x: sx(r.k), y: sy(r.silhouette) - 20,
          "text-anchor": "middle", "font-size": 13,
          fill: isBest ? "#10B981" : "#8B5CF6",
          "font-family": "IBM Plex Mono", "font-weight": "700"
        });
        t.textContent = r.silhouette.toFixed(3);
        mainSvg.appendChild(t);

        if (isBest) {
          const bestLabel = el("text", {
            x: sx(r.k), y: sy(r.silhouette) + 30,
            "text-anchor": "middle", "font-size": 15,
            fill: "#10B981", "font-family": "IBM Plex Sans", "font-weight": "700"
          });
          bestLabel.textContent = "← BEST";
          mainSvg.appendChild(bestLabel);
        }
      });
    }

    renderMathPanel(frame);
    document.getElementById("stepSub").textContent = `step ${idx} of ${frames.length - 1}`;
    document.getElementById("progressFill").style.width = `${(idx / (frames.length - 1)) * 100}%`;
    document.getElementById("btnPrev").disabled = idx === 0;
    document.getElementById("btnNext").disabled = idx === frames.length - 1;
    if (idx === frames.length - 1) stopPlaying();
  }

  // ---------------------------------------------------------------
  // 11. EVENT LISTENERS
  // ---------------------------------------------------------------
  document.getElementById("btnNext").addEventListener("click", () => { stopPlaying(); next(); });
  document.getElementById("btnPrev").addEventListener("click", () => { stopPlaying(); prev(); });
  document.getElementById("btnReset").addEventListener("click", rebuild);
  initSelect.addEventListener("change", rebuild);
  document.getElementById("btnPlay").addEventListener("click", () => {
    if (playing) stopPlaying(); else startPlaying();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { stopPlaying(); next(); }
    if (e.key === "ArrowLeft") { stopPlaying(); prev(); }
    if (e.key === " ") { e.preventDefault(); if (playing) stopPlaying(); else startPlaying(); }
  });

  // Modal controls
  const modal = document.getElementById("modalOverlay");
  const btnEditData = document.getElementById("btnEditData");
  const closeModal = document.getElementById("closeModal");
  const applyChanges = document.getElementById("applyChanges");

  btnEditData.addEventListener("click", () => {
    renderDataEditor();
    modal.classList.add("active");
  });

  closeModal.addEventListener("click", () => {
    modal.classList.remove("active");
  });

  applyChanges.addEventListener("click", () => {
    modal.classList.remove("active");
    rebuildVisualization();
  });

  modal.addEventListener("click", (e) => {
    if (e.target === modal) {
      modal.classList.remove("active");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modal.classList.contains("active")) {
      modal.classList.remove("active");
    }
  });

  // Initial paint
  renderDataEditor();
  goTo(0, false);
})();
</script>
</body>
</html>
